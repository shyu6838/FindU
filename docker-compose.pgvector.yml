services:
  pgvector:
    image: pgvector/pgvector:pg14
    container_name: findu-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: findu_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - findu_pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  findu_pgvector_data:
